<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKR Pico Monitor</title>
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <h1>SKR Pico</h1>
        <div class="conn">
          <span id="status" class="status status--off">disconnected</span>
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
        </div>
      </header>

      <section class="readouts">
        <article class="card">
          <h2>Cart position</h2>
          <div class="value">
            <span id="cart-value" class="number">--</span>
            <span class="unit">mm</span>
          </div>
        </article>

        <article class="card">
          <h2>Pole tilt (from upright)</h2>
          <div class="value">
            <span id="pot-value" class="number">--</span>
            <span class="unit">deg</span>
          </div>
          <div class="sub">raw <span id="pot-raw">--</span> &middot; + = right</div>
        </article>

        <article class="card card--wide">
          <h2>Telemetry</h2>
          <div id="telemetry" class="telemetry"></div>
        </article>
      </section>

      <section class="controls">
        <h2>Move cart</h2>
        <div class="buttons">
          <button type="button" data-delta="-10" disabled>&minus;10 mm</button>
          <button type="button" data-delta="-1" disabled>&minus;1 mm</button>
          <button type="button" data-delta="1" disabled>+1 mm</button>
          <button type="button" data-delta="10" disabled>+10 mm</button>
          <button id="go-zero" type="button" disabled>Go to 0</button>
          <button id="home" type="button" disabled>Home</button>
        </div>
        <div class="sub">Target range 0..<span id="max-travel">350</span> mm</div>
      </section>

      <section class="controls">
        <h2>Drive</h2>
        <div class="buttons">
          <button id="stop" type="button" disabled>Stop</button>
          <button id="go" type="button" disabled>Go</button>
          <button id="reset" type="button" disabled>Reset fault</button>
        </div>
        <div class="param-grid">
          <label class="param">
            <span class="param-label">mode</span>
            <select id="mode-select" disabled>
              <option value="idle">idle</option>
              <option value="hold">hold</option>
              <option value="vel">vel</option>
              <option value="square">square</option>
              <option value="sine">sine</option>
            </select>
          </label>
          <label class="param">
            <span class="param-label">vel (mm/s)</span>
            <input id="vel-input" type="number" step="1" value="50" disabled />
          </label>
          <label class="param">
            <span class="param-label">amp (mm/s)</span>
            <input id="amp-input" type="number" step="1" value="50" disabled />
          </label>
          <label class="param">
            <span class="param-label">freq (hz)</span>
            <input id="freq-input" type="number" step="0.1" value="0.5" disabled />
          </label>
          <label class="param">
            <span class="param-label">kp (gain)</span>
            <input id="kp-input" type="number" step="0.5" value="4" disabled />
          </label>
          <label class="param">
            <span class="param-label">&nbsp;</span>
            <button id="apply-params" type="button" disabled>Apply</button>
          </label>
        </div>
      </section>

      <section class="controls">
        <h2>Angle calibration</h2>
        <div class="buttons">
          <button id="calmode" type="button" disabled>Calmode: off</button>
          <button id="zero" type="button" disabled>Zero (pole vertical)</button>
          <button id="calstatus" type="button" disabled>Cal status</button>
        </div>
        <div class="param-grid">
          <label class="param">
            <span class="param-label">known angle (deg, + = right)</span>
            <input id="cal-angle" type="number" step="1" value="45" disabled />
          </label>
          <label class="param">
            <span class="param-label">&nbsp;</span>
            <button id="cal" type="button" disabled>Cal at angle</button>
          </label>
        </div>
        <div class="sub">
          Workflow: Calmode on &rarr; hold pole vertical, Zero &rarr; hold at +45&deg;,
          Cal at angle &rarr; Calmode off.
        </div>
      </section>

      <section class="controls">
        <h2>Command</h2>
        <div class="param-grid">
          <label class="param param--wide">
            <span class="param-label">any firmware command</span>
            <input id="cmd-input" type="text" placeholder="e.g. kp 4" disabled />
          </label>
          <label class="param">
            <span class="param-label">&nbsp;</span>
            <button id="cmd-send" type="button" disabled>Send</button>
          </label>
        </div>
      </section>

      <section class="log">
        <h2>Serial log</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
